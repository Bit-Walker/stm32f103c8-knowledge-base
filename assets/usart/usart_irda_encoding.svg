<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940"><rect width="1300" height="940" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#153047;font-size:18px}.title{font-size:28px;font-weight:bold}.wave{fill:none;stroke:#166ca4;stroke-width:2.5}.small{font-size:16px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#34495e"/></marker></defs><text x="35" y="45" class="title">IrDA SIR：编码极性、普通模式脉宽与半双工边界</text><text x="35" y="77" class="small">STM32F103C8 · RM0008 Rev21 §27.3.12，图295–296，pp810–812</text><rect x="40" y="110" width="200" height="140" rx="7" fill="#eef7fc" stroke="#85aac0"/><text x="55" y="186.0" class="">USART 串行路径</text><rect x="365" y="110" width="220" height="55" rx="7" fill="#eef7fc" stroke="#85aac0"/><text x="380" y="143.5" class="">SIR 发送编码器</text><rect x="365" y="195" width="220" height="55" rx="7" fill="#eef7fc" stroke="#85aac0"/><text x="380" y="228.5" class="">SIR 接收解码器</text><rect x="770" y="110" width="460" height="140" rx="7" fill="#eef7fc" stroke="#85aac0"/><text x="785" y="186.0" class="">外部红外发射/接收器（需要另接）</text><line x1="240" y1="137" x2="365" y2="137" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><line x1="585" y1="137" x2="770" y2="137" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><line x1="770" y1="222" x2="585" y2="222" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><line x1="365" y1="222" x2="240" y2="222" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><text x="257" y="124" class="">TX</text><text x="258" y="211" class="">RX</text><text x="605" y="124" class="">IrDA_OUT</text><text x="605" y="211" class="">IrDA_IN</text><text x="35" y="291" class="">仅显示 IREN=1 的有效编解码路径；普通 USART 旁路见源图295。发送与接收不能同时进行。</text><line x1="225" y1="325" x2="225" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="317" y1="325" x2="317" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="409" y1="325" x2="409" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="501" y1="325" x2="501" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="593" y1="325" x2="593" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="685" y1="325" x2="685" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="777" y1="325" x2="777" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="869" y1="325" x2="869" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="961" y1="325" x2="961" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="1053" y1="325" x2="1053" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><line x1="1145" y1="325" x2="1145" y2="600" stroke="#d5e3ea" stroke-dasharray="4 5"/><text x="255" y="345" class="">S=0</text><text x="347" y="345" class="">1</text><text x="439" y="345" class="">0</text><text x="531" y="345" class="">1</text><text x="623" y="345" class="">0</text><text x="715" y="345" class="">0</text><text x="807" y="345" class="">1</text><text x="899" y="345" class="">1</text><text x="991" y="345" class="">0</text><text x="1083" y="345" class="">STOP</text><polyline class="wave" points="190,368 225,368 225,368 225,395 317,395 317,395 317,368 409,368 409,368 409,395 501,395 501,395 501,368 593,368 593,368 593,395 685,395 685,395 685,395 777,395 777,395 777,368 869,368 869,368 869,368 961,368 961,368 961,395 1053,395 1053,395 1053,368 1145,368 1145,368 1185,368"/><text x="35" y="390" class="">TX 逻辑数据</text><polyline class="wave" points="190,482 225,482 261.8,482 261.8,455 279.05,455 279.05,482 317,482 409,482 445.8,482 445.8,455 463.05,455 463.05,482 501,482 593,482 629.8,482 629.8,455 647.05,455 647.05,482 685,482 721.8,482 721.8,455 739.05,455 739.05,482 777,482 869,482 961,482 997.8,482 997.8,455 1015.05,455 1015.05,482 1053,482 1145,482 1145,482 1185,482"/><text x="35" y="477" class="">IrDA_OUT</text><polyline class="wave" points="190,542 225,542 261.8,542 261.8,569 279.05,569 279.05,542 317,542 409,542 445.8,542 445.8,569 463.05,569 463.05,542 501,542 593,542 629.8,542 629.8,569 647.05,569 647.05,542 685,542 721.8,542 721.8,569 739.05,569 739.05,542 777,542 869,542 961,542 997.8,542 997.8,569 1015.05,569 1015.05,542 1053,542 1145,542 1145,542 1185,542"/><text x="35" y="564" class="">IrDA_IN</text><text x="35" y="633" class="">逻辑 0：发射编码输出高脉冲，接收解码输入低脉冲。逻辑 1：不发光，输出低、输入高。</text><text x="35" y="667" class="">普通模式：脉冲宽度 = 3Tbit/16；Tbit 为一个串行位的时间，单位秒。PSC 必须配置为 1。</text><text x="35" y="701" class="">此图用同一示例说明收发极性；不表示本机同时收发，也不规定光路/编解码传播延迟。</text><text x="35" y="735" class="">低功耗模式：脉宽 = 3/fLP；fLP = fPCLK/PSC，频率单位 Hz，PSC 为非零整数分频值。</text><text x="35" y="769" class="">接收低脉冲：小于 1/fLP 一定拒绝；介于 1/fLP 与 2/fLP 之间不确定；大于 2/fLP 接受。</text><text x="35" y="803" class="">上述严格大小关系不定义等于阈值时的额外保证；软件须配合收发方向与接收建立时间。</text><text x="35" y="837" class="">IrDA 模式要求 STOP=00（1 停止位），LINEN/CLKEN/SCEN/HDSEL=0；SIR 最高 115.2 kbit/s。</text><text x="35" y="890" class="small">来源的 3/16 图用于普通模式；低功耗模式使用独立时钟固定脉宽，不能直接套用该比例。</text></svg>