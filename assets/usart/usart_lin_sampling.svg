<text x="36" y="1035" class="small">B0–B10 为检测状态序号；短竖线对应源图 Capture Strobe，未展开全部过采样时钟。</text>
<text x="36" y="1070" class="small">图示强调采样值与状态顺序；线段长度不定义门限边缘、分隔符或LBD的额外传播延迟。</text>
<text x="36" y="1105" class="small">LBDL=0 时门限为10个连续低位；低位数量满足后仍需确认RX返回高电平。</text>
