<text x="36" y="577" font-size="17">D0为最低有效数据位；P为奇偶校验位。PS=0选择偶校验，PS=1选择奇校验。</text><text x="36" y="612" font-size="17">字长M=0时共8个数据/校验位置，M=1时共9个。有效数据长度还取决于PCE。</text><text x="36" y="646" font-size="16">STOP字段独立选择停止区长度；0.5/1.5停止位用于Smartcard，另见停止位采样图。</text></g></svg>