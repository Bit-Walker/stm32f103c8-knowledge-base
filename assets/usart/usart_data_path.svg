<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">STM32F103C8 USART 收发数据路径与完成层级</title>
<desc id="desc">CPU或DMA通过同一DR地址写发送缓冲TDR或读接收缓冲RDR。两侧分别连接移位寄存器和TX、RX引脚。TXE、DMA完成和USART TC表示不同阶段；接收RXNE和DMA读取也各有副作用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45;font-size:20px}.h{font-size:29px;font-weight:700}.small{font-size:17px}.label{font-size:22px;font-weight:600}.box{fill:#eef6ff;stroke:#4c78a8;stroke-width:2}.rx{fill:#eaf8f3;stroke:#36846b;stroke-width:2}.arrow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}</style>
<rect width="1280" height="820" fill="white"/>
<text x="40" y="48" class="h">USART 收发路径：一个 DR 地址，两侧独立缓冲</text>
<text x="40" y="80" class="small">适用 STM32F103C8 的 USART1 / USART2 / USART3；箭头表示数据方向，不表示周期比例。</text>
<rect x="40" y="110" width="1200" height="360" rx="12" class="panel"/>
<rect x="65" y="197" width="180" height="125" rx="10" class="box"/>
<text x="155" y="244" text-anchor="middle" class="label">CPU / DMA</text>
<text x="155" y="278" text-anchor="middle">访问 USART_DR</text>
<rect x="365" y="135" width="230" height="88" rx="8" class="box"/>
<text x="480" y="169" text-anchor="middle" class="label">发送缓冲 TDR</text>
<text x="480" y="201" text-anchor="middle">可容纳下一字符</text>
<rect x="735" y="135" width="240" height="88" rx="8" class="box"/>
<text x="855" y="169" text-anchor="middle" class="label">发送移位寄存器</text>
<text x="855" y="201" text-anchor="middle">逐位向 TX 输出</text>
<path d="M245 223H285V178H356" class="arrow"/>
<text x="288" y="156" class="small">写 DR</text>
<path d="M595 179H724" class="arrow"/>
<text x="618" y="156" class="small">内部装载</text>
<path d="M975 179H1130" class="arrow"/>
<text x="1150" y="187" class="label">TX</text>
<text x="365" y="255" class="small">TXE：TDR 空，可写下一项</text>
<rect x="365" y="300" width="230" height="88" rx="8" class="rx"/>
<text x="480" y="334" text-anchor="middle" class="label">接收缓冲 RDR</text>
<text x="480" y="366" text-anchor="middle">保存已接收字符</text>
<rect x="735" y="300" width="240" height="88" rx="8" class="rx"/>
<text x="855" y="334" text-anchor="middle" class="label">接收移位寄存器</text>
<text x="855" y="366" text-anchor="middle">从 RX 逐位接收</text>
<path d="M365 344H285V296H254" class="arrow"/>
<text x="288" y="375" class="small">读 DR</text>
<path d="M735 344H606" class="arrow"/>
<text x="618" y="322" class="small">完整字符</text>
<path d="M1130 344H986" class="arrow"/>
<text x="1150" y="352" class="label">RX</text>
<text x="365" y="420" class="small">RXNE：RDR 有接收数据；DMA / CPU 读 DR 可清 RXNE</text>
<text x="65" y="450" class="small">USART_DR 读写指向不同缓冲。收发共享波特率设置；TE / RE 分别控制发送与接收。</text>
<text x="40" y="515" class="label">发送收尾应使用对应本次事务的完成条件</text>
<rect x="40" y="538" width="365" height="134" rx="10" class="box"/>
<text x="62" y="573" class="label">TXE</text>
<text x="62" y="608">TDR 已空</text>
<text x="62" y="641" class="small">当前字符仍可能在线路上发送</text>
<rect x="458" y="538" width="365" height="134" rx="10" class="box"/>
<text x="480" y="573" class="label">发送 DMA TC</text>
<text x="480" y="608">最后一项已搬至 USART_DR</text>
<text x="480" y="641" class="small">线路最后停止位仍可能未结束</text>
<rect x="876" y="538" width="364" height="134" rx="10" class="rx"/>
<text x="898" y="573" class="label">USART TC</text>
<text x="898" y="608">最后帧发送完且 TXE = 1</text>
<text x="898" y="641" class="small">Smartcard 还受保护时间条件影响</text>
<text x="40" y="708" class="small">发送前处理残留 TC；SR→DR 访问还可能影响错误标志。接收端应统一 CPU / DMA 的读取责任。</text>
<text x="40" y="738" class="small">DMA 的 HT / TC 通知不能证明协议对端已确认，也不能恢复已被覆盖的数据。</text>
<text x="40" y="782" class="small">依据 RM0008 Rev21：图279（p789）、图282（p793）、图297–298（pp813–814）；Smartcard p809。</text>
</svg>
