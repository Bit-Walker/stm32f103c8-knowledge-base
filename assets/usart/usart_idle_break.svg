wave" points="240,546 260,546 260,574 964,574 964,546 1028,546 1028,574 1092,574"/><text x="35" y="710" class="">SBK 请求在当前字符结束后发 Break；硬件在 Break 的停止位期间清 SBK。</text><text x="35" y="749" class="">若在 Break 开始前清 SBK，本次请求取消。两次 Break 之间按原文先经过前一停止位，再置 SBK。</text><text x="35" y="788" class="">LIN 的 13 位发送 Break、Smartcard 的特殊处理另见对应模式；不由本图外推。</text><text x="35" y="827" class="small">Tbit=1/波特率，单位秒；M 为 CR1 字长选择。这里的低电平长度不再额外叠加一个起始位。</text></svg>