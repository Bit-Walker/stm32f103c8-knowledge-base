<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570"><rect width="1240" height="570" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#193a50;font-size:19px}.title{font-size:27px;font-weight:bold}.line{fill:none;stroke:#146fa2;stroke-width:3}</style><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7Z" fill="#556c7d"/></marker></defs><text x="35" y="45" class="title">同步接收的建立与保持窗口</text><text x="35" y="82">RM0008 Rev21 图292，p807；图示上升沿采样，实际边沿由 CPOL/CPHA 决定。</text><rect x="500" y="135" width="200" height="225" fill="#edf7f0"/><path d="M210 220 H600 V160 H1100" class="line"/><text x="35" y="202">CK</text><path d="M210 295 H450 L500 325 H700 L750 295 H1100 M210 325 H450 L500 295 H700 L750 325 H1100" class="line"/><text x="35" y="315">RX 数据</text><text x="515" y="278">有效数据位</text><line x1="600" y1="120" x2="600" y2="409" stroke="#a8563d" stroke-dasharray="6 5"/><text x="619" y="132">采样沿</text><line x1="500" y1="389" x2="600" y2="389" stroke="#556c7d" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="600" y1="389" x2="700" y2="389" stroke="#556c7d" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="510" y="427">tSETUP</text><text x="620" y="427">tHOLD</text><text x="35" y="479">源图要求：tSETUP = tHOLD = Tbit/16；Tbit=1/波特率，三个时间量的单位均为秒。</text><text x="35" y="521">tSETUP 为采样沿前建立时间，tHOLD 为采样沿后保持时间；此图为局部窗口放大示意。</text></svg>
