<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940"><rect width="1300" height="940" fill="#fff"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#17334c;font-size:18px}.title{font-size:28px;font-weight:bold}.small{font-size:16px}</style><text x="35" y="45" class="title">Smartcard：校验响应、NACK 与发送完成</text><text x="35" y="77" class="small">STM32F103C8 · RM0008 Rev21 §27.3.11，图293–294，pp808–810</text><text x="35" y="118" class="">数据线经 TX 双向开漏连接；M=1、PCE=1，推荐收发均为 1.5 停止位（STOP=11）。</text><text x="35" y="172" class="">校验正确</text><rect x="180" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="188" y="220.0" class="">S</text><rect x="248" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="256" y="220.0" class="">D0</text><rect x="316" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="324" y="220.0" class="">D1</text><rect x="384" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="392" y="220.0" class="">D2</text><rect x="452" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="460" y="220.0" class="">D3</text><rect x="520" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="528" y="220.0" class="">D4</text><rect x="588" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="596" y="220.0" class="">D5</text><rect x="656" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="664" y="220.0" class="">D6</text><rect x="724" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="732" y="220.0" class="">D7</text><rect x="792" y="190" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="800" y="220.0" class="">P</text><rect x="860" y="190" width="170" height="48" fill="#fff4df" stroke="#9eb6c7"/><text x="868" y="220.0" class="">停止区</text><rect x="1030" y="190" width="210" height="48" fill="#f0f7ed" stroke="#9eb6c7"/><text x="1038" y="220.0" class="">保护时间 GT</text><text x="180" y="268" class="">接收端不拉低数据线；发送端仍须满足最后字符与 GT 计数的完成条件。</text><text x="35" y="310" class="">校验出错且接收端启用 NACK</text><rect x="180" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="188" y="358.0" class="">S</text><rect x="248" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="256" y="358.0" class="">D0</text><rect x="316" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="324" y="358.0" class="">D1</text><rect x="384" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="392" y="358.0" class="">D2</text><rect x="452" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="460" y="358.0" class="">D3</text><rect x="520" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="528" y="358.0" class="">D4</text><rect x="588" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="596" y="358.0" class="">D5</text><rect x="656" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="664" y="358.0" class="">D6</text><rect x="724" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="732" y="358.0" class="">D7</text><rect x="792" y="328" width="68" height="48" fill="#eef6fc" stroke="#9eb6c7"/><text x="800" y="358.0" class="">P</text><rect x="860" y="328" width="170" height="48" fill="#fff4df" stroke="#9eb6c7"/><text x="868" y="358.0" class="">停止区</text><rect x="1030" y="328" width="210" height="48" fill="#f0f7ed" stroke="#9eb6c7"/><text x="1038" y="358.0" class="">保护时间 GT</text><path d="M860 413 H920 V433 H994 V413 H1060" fill="none" stroke="#bd4b38" stroke-width="3"/><text x="180" y="425" class="">接收端低电平响应（示意）：</text><text x="180" y="471" class="">USART 发出的 NACK 为 1 个位时钟；可接收的对方 NACK 按原文允许 1 或 2 个位时钟。</text><text x="35" y="526" class="">发送端：RE=1 回读数据线；1.5 停止位的 NACK 检测可产生 FE，并在停止区结束时报告 RXNE。</text><text x="35" y="565" class="">接收端：本帧校验失败且 NACK=1 才拉低 TX；NACK=0 时不自动发负应答。需要重发时由软件处理。</text><text x="35" y="604" class="">硬件避免将该 NACK 重新识别为起始位；0x00 加 FE 在 Smartcard 模式按数据处理，不按 Break。</text><rect x="35" y="644" width="355" height="56" fill="#eef6fc" stroke="#9eb6c7"/><text x="43" y="678.0" class="">最后移位完成且无后续发送</text><rect x="427" y="644" width="355" height="56" fill="#eef6fc" stroke="#9eb6c7"/><text x="435" y="678.0" class="">GT 计数期间：TC 保持 0</text><rect x="819" y="644" width="410" height="56" fill="#eef6fc" stroke="#9eb6c7"/><text x="827" y="678.0" class="">GT 达到配置值后：TC=1</text><path d="M394 672 H419 m-7,-6 l7,6 l-7,6" fill="none" stroke="#34495e" stroke-width="2"/><path d="M786 672 H811 m-7,-6 l7,6 l-7,6" fill="none" stroke="#34495e" stroke-width="2"/><text x="35" y="740" class="">GT 以位时钟计数；清除 TC 的语义不变。切换 TE 不发送普通 USART 的 IDLE 前导。</text><text x="35" y="779" class="">CK 为独立卡时钟：fCK,out=fPCLK/(2PSC)，PSC=1…31；与普通同步模式按数据位输出 CK 不同。</text><text x="35" y="818" class="">fCK,out 是输出频率，fPCLK 是外设输入频率，单位均为 Hz；PSC 为无量纲分频设置。</text><text x="35" y="868" class="small">帧区和 NACK 位置为事件关系示意，不按比例规定脉冲绝对起点；具体采样见停止位采样图。</text><text x="35" y="905" class="small">S=起始位；D0…D7=有效数据；P=校验位；GT=保护时间；PE/FE/RXNE/TC 为 USART 状态。</text></svg>