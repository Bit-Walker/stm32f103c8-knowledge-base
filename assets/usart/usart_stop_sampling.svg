<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800"><title>USART停止位长度与采样</title><desc>普通1停止位和2停止位在第一位第8、9、10样本检查；0.5停止位不采样；Smartcard1.5停止位在第16、17、18样本检查。</desc><rect width="1180" height="800" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#18384a"><text x="36" y="44" font-size="26" font-weight="bold">停止区：长度、检查位置与接收完成</text><text x="36" y="77" font-size="15">RM0008 Rev21 Figure281（p792）、停止位说明（pp791–792）及Figure294（p810）</text><text x="36" y="111" font-size="16">每个位时间分为16个采样周期。停止区长度按位时间标注；圆点给出手册采样编号，非绝对相位规格。</text>
