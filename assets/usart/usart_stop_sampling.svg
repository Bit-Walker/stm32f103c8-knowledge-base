<text x="36" y="728" font-size="16">高电平是普通停止区的期望值；Smartcard接收方可拉低数据线发NACK，发送方据此检查FE。</text><text x="36" y="763" font-size="16">本图为采样位置示意，不表示固定绝对传播延迟；波特率改变时，位时间及各采样间隔同步改变。</text></g></svg>