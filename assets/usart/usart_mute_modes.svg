<text x="1018" y="298" text-anchor="middle" font-size="17">RXNE</text>
<text x="36" y="202" font-size="17">线路事件</text>
<text x="36" y="250" font-size="17">RWU变化</text>
<text x="36" y="298" font-size="17">接收通知</text>
<text x="36" y="357" font-size="16">静默期间不设置接收状态标志，接收中断被抑制；此处用于退出静默的空闲帧不报告IDLE。</text><text x="36" y="412" font-size="20" font-weight="bold">2 WAKE=1：地址低4位与ADD比较，本例ADD=1</text><text x="36" y="443" font-size="16">起始状态RWU=1。地址标记采用最高有效数据位，不采用校验位。</text>
