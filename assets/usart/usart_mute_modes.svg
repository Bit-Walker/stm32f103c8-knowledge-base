<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780"><title>USART静默与地址唤醒</title><desc>WAKE0由空闲帧退出静默但不置IDLE；WAKE1由匹配地址退出，匹配地址自身产生RXNE，非匹配地址不产生RXNE或DMA请求。</desc><rect width="1180" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#18384a"><text x="36" y="44" font-size="26" font-weight="bold">静默接收：哪些字符会交给软件</text><text x="36" y="76" font-size="15">RM0008 Rev21 Figures285–286，pp801–802 · 按事件、状态和接收通知整合</text><text x="36" y="119" font-size="20" font-weight="bold">1 WAKE=0：检测到空闲帧，退出静默</text><text x="36" y="150" font-size="16">软件置RWU=1后进入下列序列；空闲唤醒的前置条件见正文与CR1.RWU说明。</text>
<rect x="190" y="174" width="177" height="43" fill="#e3f1f9" stroke="#bdcfd9"/>
