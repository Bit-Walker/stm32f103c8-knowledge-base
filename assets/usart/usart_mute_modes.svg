<text x="36" y="543" font-size="17">RWU变化</text>
<text x="36" y="591" font-size="17">接收通知</text>
<text x="36" y="651" font-size="16">匹配地址本身产生RXNE；非匹配地址不产生RXNE、中断或DMA请求。软件改RWU须满足RXNE=0。</text><text x="36" y="692" font-size="16">CR2.ADD为4位地址；普通数据最高有效位为0，地址字符该位为1。</text><text x="36" y="738" font-size="16" fill="#995026">C8勘误：静默地址唤醒可漏报该地址的PE；空闲检测也有时钟偏差限制（ES096 §2.9.2 / §2.9.4）。</text></g></svg>