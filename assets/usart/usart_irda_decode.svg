<text x="35" y="544" class="">RX恢复位流</text>
<text x="35" y="610" class="small">普通模式：每个逻辑0编码为3Tbit/16高脉冲；接收端对应低脉冲，译码恢复整个位流。</text>
<text x="35" y="646" class="small">Tbit 为串行位周期，单位秒。RX画出相对位移以保留源图关系，未指定编码、光路或译码的延迟值。</text>
<text x="35" y="682" class="small">发送输出空闲低、接收输入空闲高；逻辑1无脉冲。低功耗模式使用独立时钟决定脉宽。</text>
<text x="35" y="718" class="small">图中的横向位移与脉冲位置不用于推导额外时序保证；脉宽的3/16比例仅适用于普通模式。</text>
</svg>