<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1250" viewBox="0 0 1640 1250" role="img" aria-labelledby="title desc"><title id="title">EXTI 中断与事件的门控拓扑</title><desc id="desc">自主绘制的技术关系示意。带圆点的分支连接；无圆点的交叉不表示连接。具体型号与电气适用条件见图下注。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e42" font-size="21"><text x="48" y="55" font-size="36" fill="#182e42" text-anchor="start" font-weight="bold">EXTI：中断挂起与事件脉冲的两条路径</text><text x="48" y="96" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">STM32F103C8T6：19 条线（0–18）；下图表示逐线重复的逻辑，不表示 19 个 GPIO 引脚。</text><rect x="530" y="140" width="560" height="56" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="810.0" y="175.0" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">AMBA APB 总线</text><rect x="430" y="235" width="770" height="64" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="815.0" y="274.0" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">外设寄存器接口 · APB2</text><polyline points="810,196 810,235" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="160,267 430,267" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="170" y="247" font-size="22" fill="#182e42" text-anchor="start" font-weight="normal">PCLK2</text><rect x="220" y="360" width="170" height="72" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="305.0" y="388.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">RTSR</text><text x="305.0" y="417.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">上升沿选择</text><polyline points="305,360 305,325 460,325 460,299" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/><rect x="455" y="360" width="170" height="72" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="540.0" y="388.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">FTSR</text><text x="540.0" y="417.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">下降沿选择</text><polyline points="540,360 540,325 540,325 540,299" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/><rect x="690" y="360" width="170" height="72" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="775.0" y="388.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">SWIER</text><text x="775.0" y="417.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">软件触发</text><polyline points="775,360 775,325 775,325 775,299" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/><rect x="925" y="360" width="170" height="72" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1010.0" y="388.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">IMR</text><text x="1010.0" y="417.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">中断掩码</text><polyline points="1010,360 1010,325 1010,325 1010,299" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/><rect x="1160" y="360" width="170" height="72" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1245.0" y="388.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">EMR</text><text x="1245.0" y="417.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">事件掩码</text><polyline points="1245,360 1245,335 1140,335 1140,299" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/><rect x="1395" y="360" width="170" height="72" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1480.0" y="388.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">PR</text><text x="1480.0" y="417.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">挂起寄存器</text><polyline points="1480,360 1480,315 1190,315 1190,299" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/><text x="50" y="161" font-size="18" fill="#687b89" text-anchor="start" font-weight="normal">灰虚线：寄存器访问</text><text x="50" y="190" font-size="18" fill="#687b89" text-anchor="start" font-weight="normal">各 19 位；与触发信号分开</text><rect x="50" y="650" width="140" height="76" rx="9" fill="#fff4da" stroke="#91640e" stroke-width="2"/><text x="120.0" y="680.5" font-size="21" fill="#91640e" text-anchor="middle" font-weight="normal">输入线</text><text x="120.0" y="709.5" font-size="21" fill="#91640e" text-anchor="middle" font-weight="normal">0–18</text><rect x="280" y="650" width="220" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="390.0" y="680.5" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">边沿检测</text><text x="390.0" y="709.5" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">上升 / 下降 / 双边沿</text><polyline points="190,688 280,688" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="305,432 305,580 350,580 350,650" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="540,432 540,600 440,600 440,650" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="650" y="650" width="100" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="700.0" y="695.0" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">OR</text><polyline points="500,688 650,688" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="775,432 775,555 700,555 700,650" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="750,688 840,688" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><circle cx="840" cy="688" r="5" fill="#155e91"/><rect x="925" y="545" width="125" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="987.5" y="590.0" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">AND</text><polyline points="840,688 840,583 925,583" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1010,432 1010,545" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1050,583 1480,583 1480,432" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1130" y="535" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">IMR 门控后</text><text x="1130" y="560" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">置位 PR</text><polyline points="1565,396 1600,396 1600,688 1480,688" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1280" y="650" width="200" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1380.0" y="680.5" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">NVIC</text><text x="1380.0" y="709.5" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">中断请求</text><text x="1445" y="768" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">PR 状态送 NVIC</text><rect x="925" y="830" width="125" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="987.5" y="875.0" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">AND</text><polyline points="840,688 840,868 925,868" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1245,432 1245,805 985,805 985,830" fill="none" stroke="#0d7969" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1175" y="790" font-size="19" fill="#0d7969" text-anchor="start" font-weight="normal">EMR</text><rect x="1150" y="830" width="190" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1245.0" y="875.0" font-size="21" fill="#155e91" text-anchor="middle" font-weight="normal">脉冲发生器</text><polyline points="1050,868 1150,868" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1340,868 1550,868" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1550" y="841" font-size="22" fill="#182e42" text-anchor="end" font-weight="normal">事件脉冲</text><text x="50" y="946" font-size="21" fill="#182e42" text-anchor="start" font-weight="normal">OR：硬件边沿检测结果与软件触发汇合；AND：对应掩码位为 1 时放行。事件支路不经过 PR。</text><polyline points="48,994 1552,994" fill="none" stroke="#ccd8e1" stroke-width="2.7" stroke-linejoin="round"/><text x="48" y="1020" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">来源：ST RM0008 Rev21；自主布局的技术关系图，非原厂插图。 §10.2.2 p207 Figure20；行为条件：§10.2.4 pp208–209、§10.3 pp211–214。</text><text x="48" y="1051" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">PR 写 1 清除；SWIER 相应位从 0→1 产生软件请求，清 PR 会清对应 SWIER 位。IMR 与 EMR 独立。</text><text x="48" y="1082" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">0–15：GPIO 同号选择；16：PVD；17：RTC Alarm；18：USB Wakeup。连通型的线19不适用于 C8。</text><text x="48" y="1113" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">GPIO 来源须为 LQFP48 实际可用引脚，不能照搬全系列端口集合；GPIO 作 EXTI 按 §9.1.3 / Table33 配输入模式。</text><text x="48" y="1144" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">PCLK2 连接外设接口；图不据此添加边沿检测时钟或延迟模型。圆点才表示相连分支，交叉无圆点不相连。</text><text x="48" y="1175" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">附图对原 Figure20 的 EMR 补画了接口访问线（灰虚线），依据 §10.3.2；不是声称原图已画出该连线。</text></g></svg>