<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc"><title id="title">GPIO 复用：由外设驱动输出</title><desc id="desc">自主绘制的技术关系示意。带圆点的分支连接；无圆点的交叉不表示连接。具体型号与电气适用条件见图下注。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e42" font-size="21"><text x="48" y="55" font-size="36" fill="#182e42" text-anchor="start" font-weight="bold">GPIO 复用：由外设驱动输出</text><text x="48" y="96" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">AF 输出接管输出控制；ODR 不接输出控制。输入仍可分送 IDR 与 AF 输入。</text><rect x="350" y="310" width="710" height="305" rx="14" fill="none" stroke="#a4b9c8" stroke-dasharray="9 7" stroke-width="2"/><text x="368" y="340" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">输入驱动区</text><rect x="350" y="640" width="710" height="250" rx="14" fill="none" stroke="#a4b9c8" stroke-dasharray="9 7" stroke-width="2"/><text x="368" y="670" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">输出驱动区</text><rect x="50" y="390" width="100" height="60" rx="9" fill="#fff4da" stroke="#91640e" stroke-width="2"/><text x="100.0" y="427.0" font-size="21" fill="#91640e" text-anchor="middle" font-weight="normal">I/O脚</text><polyline points="150,420 740,420" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><circle cx="200" cy="420" r="5" fill="#155e91"/><circle cx="300" cy="420" r="5" fill="#155e91"/><polyline points="200,420 200,342" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><path d="M188,342 L200,318 L212,342 Z M184,318 H216" fill="white" stroke="#155e91" stroke-width="2.5"/><polyline points="200,318 200,290" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><text x="200" y="270" font-size="18" fill="#182e42" text-anchor="middle" font-weight="normal">VDD 或 VDD_FT(1)</text><polyline points="184,290 216,290" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="200,420 200,478" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><path d="M188,502 L200,478 L212,502 Z M184,478 H216" fill="white" stroke="#155e91" stroke-width="2.5"/><polyline points="200,502 200,550" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="184,550 216,550" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><text x="200" y="578" font-size="18" fill="#182e42" text-anchor="middle" font-weight="normal">VSS</text><text x="60" y="615" font-size="18" fill="#687b89" text-anchor="start" font-weight="normal">上下保护二极管</text><rect x="740" y="382" width="180" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="830.0" y="412.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">TTL 施密特</text><text x="830.0" y="441.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">on</text><polyline points="920,420 1170,420" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1170" y="382" width="180" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1260.0" y="412.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">IDR</text><text x="1260.0" y="441.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">输入数据寄存器</text><polyline points="1350,420 1490,420" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1480" y="390" font-size="20" fill="#182e42" text-anchor="end" font-weight="normal">软件读</text><circle cx="1000" cy="420" r="5" fill="#155e91"/><polyline points="1000,420 1000,270 1450,270" fill="none" stroke="#0d7969" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1210" y="251" font-size="20" fill="#0d7969" text-anchor="middle" font-weight="normal">AF 输入 → 片上外设</text><text x="395" y="563" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">弱上拉 / 弱下拉：均禁用</text><rect x="1170" y="712" width="180" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1260.0" y="742.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">ODR</text><text x="1260.0" y="771.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">输出数据寄存器</text><polyline points="1350,750 1485,750" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1480" y="719" font-size="20" fill="#182e42" text-anchor="end" font-weight="normal">软件读 / 写</text><rect x="1170" y="920" width="180" height="62" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1260.0" y="943.5" font-size="18" fill="#155e91" text-anchor="middle" font-weight="normal">BSRR / BRR</text><text x="1260.0" y="972.5" font-size="18" fill="#155e91" text-anchor="middle" font-weight="normal">位设置 / 复位</text><polyline points="1260,920 1260,788" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1485,950 1350,950" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1480" y="917" font-size="20" fill="#182e42" text-anchor="end" font-weight="normal">软件写</text><text x="520" y="620" font-size="18" fill="#182e42" text-anchor="middle" font-weight="normal">VDD</text><polyline points="520,628 520,664 510,664" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="510,664 510,702" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="510,702 520,702 520,750 520,783 510,783" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="510,783 510,821" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="510,821 520,821 520,857" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><text x="520" y="883" font-size="18" fill="#182e42" text-anchor="middle" font-weight="normal">VSS</text><polyline points="540,658 540,708" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="540,777 540,827" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><circle cx="548" cy="682" r="7" fill="white" stroke="#155e91" stroke-width="2.5"/><polyline points="690,723 600,723 600,682 555,682" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="690,777 620,777 620,802 540,802" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><circle cx="520" cy="750" r="5" fill="#155e91"/><polyline points="520,750 300,750 300,420" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><text x="390" y="707" font-size="18" fill="#182e42" text-anchor="start" font-weight="normal">P-MOS</text><text x="390" y="827" font-size="18" fill="#182e42" text-anchor="start" font-weight="normal">N-MOS</text><rect x="690" y="702" width="220" height="96" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="800.0" y="742.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">输出控制</text><text x="800.0" y="771.5" font-size="20" fill="#155e91" text-anchor="middle" font-weight="normal">推挽 / 开漏</text><polyline points="1170,750 1120,750" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round"/><circle cx="1120" cy="750" r="5" fill="#687b89"/><text x="1090" y="696" font-size="18" fill="#a44236" text-anchor="middle" font-weight="normal">ODR 路径断开</text><polyline points="1450,1050 960,1050 960,750 910,750" fill="none" stroke="#0d7969" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1150" y="1030" font-size="20" fill="#0d7969" text-anchor="start" font-weight="normal">AF 输出 ← 片上外设</text><text x="50" y="1010" font-size="19" fill="#687b89" text-anchor="start" font-weight="normal">实线：电气 / 信号连接   ●：相连分支   箭头：数据方向</text><text x="50" y="1042" font-size="19" fill="#687b89" text-anchor="start" font-weight="normal">虚线框：功能分区（不表示制造尺寸）   空断点：断开路径</text><polyline points="48,1104 1552,1104" fill="none" stroke="#ccd8e1" stroke-width="2.7" stroke-linejoin="round"/><text x="48" y="1130" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">来源：ST RM0008 Rev21；自主布局的技术关系图，非原厂插图。 §9.1.9 pp164–165 Figure17</text><text x="48" y="1161" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">弱上下拉禁用。推挽 / 开漏输出取决于外设驱动；外设未激活时 AF 输出未规定（§9.1.4 p162）。</text><text x="48" y="1192" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">注1：VDD_FT 是 5 V 容忍 I/O 专用的电位，与 VDD 不同；此图不承诺任意 5 V 或掉电容忍。</text><text x="48" y="1223" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">适用：STM32F103C8T6（LQFP48）；普通 / FT 类型、模拟能力及电气限制须按 DS5319 Rev20 §3 Table5 核对。</text></g></svg>