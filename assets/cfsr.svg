<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">CFSR 子寄存器位段与访问地址</title><desc id="desc">31至16位为16位UFSR，15至8位为8位BFSR，7至0位为8位MMFSR。CFSR基址E000ED28，UFSR半字地址E000ED2A，BFSR字节地址E000ED29，MMFSR字节地址E000ED28。</desc>
<rect width="960" height="320" fill="#f8fafc"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#172a3a"><text x="40" y="40" font-size="24">CFSR：32位状态字中的三个子域</text><text x="40" y="69" font-size="15">自主字段示意 · PM0056 Rev7 Figure20 p142；访问宽度见 §4.4.14 p148</text>
<rect x="40" y="112" width="440" height="86" fill="#dcebf8" stroke="#24628a"/><rect x="480" y="112" width="220" height="86" fill="#dbf0e8" stroke="#24628a"/><rect x="700" y="112" width="220" height="86" fill="#fff0d2" stroke="#24628a"/>
<g font-size="17"><text x="40" y="101">31</text><text x="455" y="101">16</text><text x="488" y="101">15</text><text x="680" y="101">8</text><text x="708" y="101">7</text><text x="910" y="101">0</text></g>
<g text-anchor="middle"><text x="260" y="149" font-size="23">UFSR</text><text x="260" y="179" font-size="17">UsageFault · 16位</text><text x="590" y="149" font-size="23">BFSR</text><text x="590" y="179" font-size="17">BusFault · 8位</text><text x="810" y="149" font-size="23">MMFSR</text><text x="810" y="179" font-size="17">MemManage · 8位</text>
<g font-size="15"><text x="260" y="229">0xE000ED2A · 对齐半字</text><text x="590" y="229">0xE000ED29 · 字节</text><text x="810" y="229">0xE000ED28 · 字节</text></g></g>
<text x="40" y="273" font-size="16">CFSR基址：0xE000ED28；支持字节、对齐半字和对齐字访问。</text><text x="40" y="300" font-size="16">读取不清故障状态；故障状态位写1清。分域访问不产生原子快照保证。</text></g></svg>