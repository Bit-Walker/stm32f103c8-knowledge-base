<text x="30" y="708" font-size="17" text-anchor="start">采样时 Sa 选择 VIN、Sb 闭合；保持后通过电荷重分配逐位比较。图示开关位置用于拓扑，不指定同一运行状态。</text>
<text x="30" y="739" font-size="16" text-anchor="start">VIN、VREF、VCOMP：电压（V）；C及各权重：电容（F）；S1–S11、Sa、Sb是原理开关标号。</text>
<text x="30" y="771" font-size="15" text-anchor="start">来源：AN2834 Rev10 §2保留的SAR结构图；十一支路权重为 C…C/512，再加一支 C/512。图不指定电容绝对值。</text>
