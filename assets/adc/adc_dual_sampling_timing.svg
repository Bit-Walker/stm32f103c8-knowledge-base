<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">STM32F103C8T6 双 ADC 同时与交错采样</title>
<desc id="desc">三个时序示例比较规则同时采样、快速交错和慢速交错。横轴单位为ADC时钟周期，绿色为采样，蓝色为12.5周期转换。示例假定无注入抢占。</desc>
<rect width="1200" height="940" fill="white"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#19364a">
<text x="30" y="43" font-size="27" fill="#19364a" font-weight="bold" text-anchor="start">双 ADC：同时采样与交错采样</text>
<text x="30" y="73" font-size="17" fill="#19364a" font-weight="normal" text-anchor="start">C8T6 示例；横轴为 ADCCLK 周期。无注入抢占，省略外部触发同步延迟。</text>
<rect x="30" y="94" width="24" height="17" rx="2" fill="#a5dfc2" stroke="none"/>
