<text x="300" y="566" font-size="15" fill="#19364a" font-weight="normal" text-anchor="start">ADC2 先启动，ADC1 延后 7 周期；同一输入的采样窗口不重叠。</text>
<text x="40" y="635" font-size="21" fill="#19364a" font-weight="bold" text-anchor="start">慢速交错</text>
<text x="40" y="664" font-size="16" fill="#19364a" font-weight="normal" text-anchor="start">S = 13.5</text>
