<text x="1048" y="779" font-size="14" fill="#19364a" font-weight="normal" text-anchor="middle">68</text>
<text x="1120" y="778" font-size="14" fill="#19364a" font-weight="normal" text-anchor="start">周期</text>
<text x="300" y="801" font-size="15" fill="#19364a" font-weight="normal" text-anchor="start">ADC2 于 28 周期后再次启动；单次 26 周期转换不能改写固定启动节拍。</text>
<text x="30" y="854" font-size="16" fill="#19364a" font-weight="normal" text-anchor="start">数据：ADC1_DR 高 16 位为 ADC2、低 16 位为 ADC1；硬件配对读取要求 ADC1.CR2.DMA=1。</text>
<text x="30" y="883" font-size="16" fill="#19364a" font-weight="normal" text-anchor="start">交错模式按时间顺序先取 ADC2 半字；同时模式将两半字作为一对。注入抢占后的时序须另核。</text>
<text x="30" y="917" font-size="15" fill="#19364a" font-weight="normal" text-anchor="start">来源：RM0008 Rev21 §11.9.2–4，图31–33，pp230–232；按 C8T6 可用通道重新编排示例。</text>
