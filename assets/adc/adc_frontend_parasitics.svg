<text x="30" y="464" font-size="17">外部：RAIN源电阻，CAIN输入电容，CP板级寄生；原图还将外部电容记为CPCB或CAIN。</text>
<text x="30" y="499" font-size="17">内部：RPAR串联寄生电阻，CPAR复用后寄生电容，CADC采样电容；MUX为通道复用器。</text>
<text x="30" y="534" font-size="17">R类符号单位Ω，C类符号单位F，VAIN单位V；ADCCLK为转换时钟。本图不给出寄生数值。</text>
<text x="30" y="569" font-size="17">供电与参考：保留VDDA/VSSA、VDD/VSS及VREF±的功能区分；C8的VREF±已在封装内连接模拟电源/地。</text>
<text x="30" y="604" font-size="16">来源：AN2834 Rev10 input_parasitics、source_capacitance 保留图；C8连接按DS5319。</text>
