<text x="30" y="966" font-size="16" text-anchor="start">∥ 表示电容并联；原文要求 10 nF 使用良好陶瓷电容并尽量靠近芯片。并联电容符号作组合标注，不表示串联。</text>
<text x="30" y="995" font-size="15" text-anchor="start">原图39/40脚注称独立 VREF 引脚仅见100脚封装；此处只确认 C8T6 的内部参考连接，不外推其它封装。</text>
<text x="30" y="1024" font-size="15" text-anchor="start">来源：DS5319 Rev20 图38与注1–4、图39与注1，p77；图40与注1，p78。</text>
