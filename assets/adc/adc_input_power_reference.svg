<text x="30" y="582" font-size="16" text-anchor="start">RAIN / RADC：外部源电阻 / 内部采样电阻（Ω）；CADC / Cparasitic：采样 / 寄生电容（F）；Ilkg：漏电流（A）。</text>
<text x="30" y="610" font-size="16" text-anchor="start">Cparasitic 包含 PCB 与焊盘电容；漏电和焊盘参数见表36，ADC参数见表47，供电引脚关系另见原图14。</text>
<text x="30" y="638" font-size="16" text-anchor="start">图中的钳位不授权输入越界。正常模拟输入、电气注入限制及负注入对其它通道精度的影响须分别核查。</text>
