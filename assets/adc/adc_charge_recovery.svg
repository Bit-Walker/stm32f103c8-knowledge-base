<path d="M470 317.5526664367766V384" fill="none" stroke="#9b6d35" stroke-width="2" stroke-dasharray="6 4"/>
<text x="470" y="411" font-size="17" text-anchor="middle">较短窗口结束</text>
<path d="M970 343.5506827917053V384" fill="none" stroke="#9b6d35" stroke-width="2" stroke-dasharray="6 4"/>
<text x="970" y="411" font-size="17" text-anchor="middle">延长窗口结束</text>
<path d="M80 339H1180" fill="none" stroke="#aabfcb" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1180" y="325" font-size="15" text-anchor="end">允许残差示意</text>
<text x="510" y="257" font-size="17" text-anchor="start">短窗口仍有残差</text>
<path d="M545 268L473 318" fill="none" stroke="#53798c" stroke-width="2" marker-end="url(#a)"/>
<text x="1020" y="298" font-size="16" text-anchor="middle">充分恢复后进入位转换</text>
<text x="1178" y="370" font-size="16" text-anchor="end">时间</text>
<text x="30" y="450" font-size="16" text-anchor="start">窗口延长可增加恢复时间；加入电容也会改变总时间常数，不能只增加容量而不重新检查采样与恢复。</text>
<text x="30" y="493" font-size="22" text-anchor="start">2  单次扰动小，连续重复仍可能累积</text>
<path d="M80 715H1180" fill="none" stroke="#53798c" stroke-width="2"/>
<path d="M80 715V525" fill="none" stroke="#53798c" stroke-width="2"/>
<text x="85" y="539" font-size="16" text-anchor="start">附加电压</text>
