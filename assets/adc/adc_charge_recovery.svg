<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-labelledby="title desc"><title id="title">采样尖峰、窗口长度和电荷累积</title><desc id="desc">按AN2834高阻输入示意，区分窗口结束残差、重复电荷累积和外部储能电容恢复。曲线是关系示意，不是芯片测试数据。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#517387"/></marker></defs><rect width="1280" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#193b4c">
<text x="30" y="42" font-size="27" text-anchor="start">高阻输入：采样窗口和恢复间隔分别约束</text>
<text x="30" y="75" font-size="16" text-anchor="start">曲线仅重组原图关系；非实测、非按比例，扰动按同方向示意，不构成 F103 新增参数保证。</text>
<text x="30" y="118" font-size="22" text-anchor="start">1  窗口终点的残差：加长窗口，让输入继续恢复</text>
<path d="M80 345H1180" fill="none" stroke="#53798c" stroke-width="2"/>
<path d="M80 345V145" fill="none" stroke="#53798c" stroke-width="2"/>
<text x="85" y="155" font-size="16" text-anchor="start">附加电压</text>
