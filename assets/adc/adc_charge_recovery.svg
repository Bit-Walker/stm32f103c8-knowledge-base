<path d="M80 675H1180" fill="none" stroke="#aabfcb" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1170" y="664" font-size="15" text-anchor="end">允许峰值示意</text>
<text x="500" y="560" font-size="17" text-anchor="start">间隔短：新扰动叠加旧残差</text>
<text x="800" y="757" font-size="17" text-anchor="middle">恢复间隔足够：每次扰动有时间衰减</text>
<text x="1178" y="739" font-size="16" text-anchor="end">时间</text>
<text x="30" y="802" font-size="16" text-anchor="start">对应模型：每次带入 Qinj = Csh × Umax；外部电容越大，单次台阶越小，但 Rin × Cext 的恢复尺度也变大。</text>
<text x="30" y="835" font-size="16" text-anchor="start">Qinj：电荷（C）；Csh / Cext：内部采样 / 外部电容（F）；Umax：最坏电压差（V）；Rin：源电阻（Ω）。</text>
<text x="30" y="871" font-size="16" text-anchor="start">有限重复采样要求 Cext &gt; Csh×Umax/Uerr，并满足正文的对数恢复时间公式；Uerr 为允许附加误差（V）。</text>
<text x="30" y="909" font-size="16" text-anchor="start">图中允许线只示意误差上限，不指定其数值。AN 原文用 0.5 LSB；DS5319 的建立条件另采用 0.25 LSB。</text>
<text x="30" y="952" font-size="15" text-anchor="start">来源：AN2834 Rev10 §4.4 的采样尖峰、延长采样和电荷累积图；三图关系合并，数值算例另保留系列限制。</text>
</g></svg>
