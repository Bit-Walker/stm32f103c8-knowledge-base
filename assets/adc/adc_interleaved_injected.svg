<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335" viewBox="0 0 1000 335"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#465c76"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#20344e"><text x="30" y="38" font-size="23" font-weight="bold">交错转换被同步注入打断后恢复（原图 38 的 C8 可引出通道示例）</text><rect x="30" y="100" width="270" height="95" rx="8" fill="#edf4fa" stroke="#7695b5"/><text x="165.0" y="127" text-anchor="middle" font-size="16">ADC2 采 CH0</text><text x="165.0" y="150" text-anchor="middle" font-size="16">ADC1 延后 7 周期采 CH0</text><text x="165.0" y="173" text-anchor="middle" font-size="16">交错规则转换</text><rect x="365" y="100" width="270" height="120" rx="8" fill="#edf4fa" stroke="#7695b5"/><text x="500.0" y="127" text-anchor="middle" font-size="16">注入触发到来，规则中断</text><text x="500.0" y="150" text-anchor="middle" font-size="16">ADC1：CH1 → CH2</text><text x="500.0" y="173" text-anchor="middle" font-size="16">ADC2：CH2 → CH1</text><text x="500.0" y="196" text-anchor="middle" font-size="16">对应项同步采样</text><rect x="710" y="100" width="260" height="95" rx="8" fill="#edf4fa" stroke="#7695b5"/><text x="840.0" y="127" text-anchor="middle" font-size="16">注入组结束</text><text x="840.0" y="150" text-anchor="middle" font-size="16">恢复 CH0 交错规则转换</text><text x="840.0" y="173" text-anchor="middle" font-size="16">继续写规则数据寄存器</text><path d="M300,145 L365,145" fill="none" stroke="#465c76" stroke-width="2" marker-end="url(#a)"/><text x="332.5" y="138.0" font-size="14" text-anchor="middle">注入事件</text><path d="M635,145 L710,145" fill="none" stroke="#465c76" stroke-width="2" marker-end="url(#a)"/><text x="672.5" y="138.0" font-size="14" text-anchor="middle">组完成</text><text x="30" y="290" font-size="15">使用组合模式；两 ADC 同步采样不同输入，对应项采样时间相同。</text><text x="30" y="312" font-size="15">ADCCLK 分频为 ÷4 时，恢复间距可能为 8、6 周期，而非 7、7 周期。</text></g></svg>