<text x="35" y="382" class="body" text-anchor="start">D11…D0：12位结果；S：符号扩展。注入结果先减对应 JOFR 偏移，可能为负。</text>
<text x="35" y="411" class="body" text-anchor="start">注入左对齐保留 bit15 符号、bit14:3 数据；不能按规则左对齐统一右移4位解释。</text>
<line x1="35" y1="437" x2="1165" y2="437" stroke="#bcc8d4"/>
<text x="35" y="474" class="body" text-anchor="start">注入序列：JL 是转换次数减一，未使用的前部槽位不参与本次序列</text>
<text x="35" y="522" class="body" text-anchor="start">JL=0  ·  1次转换</text>
<rect x="280" y="497" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="336" y="521" class="body" text-anchor="middle">JSQ4</text>
<text x="35" y="572" class="body" text-anchor="start">JL=1  ·  2次转换</text>
<rect x="280" y="547" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="336" y="571" class="body" text-anchor="middle">JSQ3</text>
<text x="410" y="571" class="body" text-anchor="middle">→</text>
<rect x="430" y="547" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="486" y="571" class="body" text-anchor="middle">JSQ4</text>
<text x="35" y="622" class="body" text-anchor="start">JL=2  ·  3次转换</text>
<rect x="280" y="597" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="336" y="621" class="body" text-anchor="middle">JSQ2</text>
<text x="410" y="621" class="body" text-anchor="middle">→</text>
<rect x="430" y="597" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="486" y="621" class="body" text-anchor="middle">JSQ3</text>
<text x="560" y="621" class="body" text-anchor="middle">→</text>
<rect x="580" y="597" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="636" y="621" class="body" text-anchor="middle">JSQ4</text>
<text x="35" y="672" class="body" text-anchor="start">JL=3  ·  4次转换</text>
<rect x="280" y="647" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="336" y="671" class="body" text-anchor="middle">JSQ1</text>
<text x="410" y="671" class="body" text-anchor="middle">→</text>
<rect x="430" y="647" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="486" y="671" class="body" text-anchor="middle">JSQ2</text>
<text x="560" y="671" class="body" text-anchor="middle">→</text>
<rect x="580" y="647" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="636" y="671" class="body" text-anchor="middle">JSQ3</text>
<text x="710" y="671" class="body" text-anchor="middle">→</text>
<rect x="730" y="647" width="112" height="36" rx="6" fill="#dff3f2" stroke="#428c88"/>
<text x="786" y="671" class="body" text-anchor="middle">JSQ4</text>
<text x="35" y="735" class="body" text-anchor="start">例：JL=2，JSQ4/3/2/1 = 3/3/7/2，则转换通道顺序为 7 → 3 → 3。</text>
<text x="35" y="778" class="small" text-anchor="start">来源：RM0008 Rev21 §11.5 Figures27–28 p224；§11.12.12 ADC_JSQR p250。</text>
<text x="35" y="802" class="small" text-anchor="start">此图整理寄存器位与执行顺序；不表示采样时间比例、总线访问宽度或实测波形。</text>
