<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">AN2548 图3：两通道阶段交叠的自主整理</title>
<desc id="desc">按AN2548 Rev9第8页图3的格线保留两行仲裁、AHB访问和Ack的相对位置。第一次交叠覆盖上一行最后一个访问周期及Ack；再次交叠覆盖下一行最后两个访问周期。正文的最后两个访问周期描述另列，未裁决图文差异，不构成F103硬件时序保证。</desc>
<rect width="1600" height="1140" fill="white"/>
<g font-family="Noto Sans CJK SC,sans-serif" fill="#1b3447">
<text x="45" y="54" font-size="35" font-weight="700">两通道的仲裁与访问如何交叠</text>
<text x="45" y="96" font-size="23">按 AN2548 Rev9 p8 图3的相对网格自主整理；此图展示原图表达，不代表 F103 实测或确定周期保证。</text>
<text x="45" y="145" font-size="22">读图：1格对应原图所画的1个时钟周期。t0–t15为本图新增的相对格线编号，不是实际时间单位。</text>
<rect x="45" y="173" width="440" height="67" rx="10" fill="#e9e0f1" stroke="#b6c5ce" stroke-width="2"/>
<text x="65" y="215" font-size="23" font-weight="700">请求仲裁 · Request arbitration</text>
<rect x="517" y="173" width="500" height="67" rx="10" fill="#dfedf5" stroke="#b6c5ce" stroke-width="2"/>
<text x="537" y="215" font-size="23" font-weight="700">AHB 总线访问 · AHB bus access</text>
<rect x="1049" y="173" width="506" height="67" rx="10" fill="#d9eee4" stroke="#b6c5ce" stroke-width="2"/>
<text x="1069" y="215" font-size="23" font-weight="700">确认阶段 · Ack（acknowledge）</text>
<rect x="635" y="298" width="172" height="326" rx="10" fill="#fff5dc" stroke="#d8ab42" stroke-width="2"/>
<rect x="893" y="298" width="172" height="326" rx="10" fill="#f0f5fe" stroke="#87a6ca" stroke-width="2"/>
<line x1="205" y1="310" x2="205" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="192" y="283" font-size="18">t0</text>
<line x1="291" y1="310" x2="291" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="278" y="283" font-size="18">t1</text>
<line x1="377" y1="310" x2="377" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="364" y="283" font-size="18">t2</text>
<line x1="463" y1="310" x2="463" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="450" y="283" font-size="18">t3</text>
<line x1="549" y1="310" x2="549" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="536" y="283" font-size="18">t4</text>
<line x1="635" y1="310" x2="635" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="622" y="283" font-size="18">t5</text>
<line x1="721" y1="310" x2="721" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="708" y="283" font-size="18">t6</text>
<line x1="807" y1="310" x2="807" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="794" y="283" font-size="18">t7</text>
<line x1="893" y1="310" x2="893" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="880" y="283" font-size="18">t8</text>
<line x1="979" y1="310" x2="979" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="966" y="283" font-size="18">t9</text>
<line x1="1065" y1="310" x2="1065" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1052" y="283" font-size="18">t10</text>
<line x1="1151" y1="310" x2="1151" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1138" y="283" font-size="18">t11</text>
<line x1="1237" y1="310" x2="1237" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1224" y="283" font-size="18">t12</text>
<line x1="1323" y1="310" x2="1323" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1310" y="283" font-size="18">t13</text>
<line x1="1409" y1="310" x2="1409" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1396" y="283" font-size="18">t14</text>
<line x1="1495" y1="310" x2="1495" y2="616" stroke="#bcc8d1" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1482" y="283" font-size="18">t15</text>
<text x="45" y="372" font-size="25" font-weight="700">上行 · A</text>
<text x="45" y="407" font-size="19">原图上行</text>
<text x="45" y="527" font-size="25" font-weight="700">下行 · B</text>
<text x="45" y="562" font-size="19">原图下行</text>
<rect x="291" y="335" width="172" height="104" rx="10" fill="#e9e0f1" stroke="#859dac" stroke-width="2"/>
<text x="305" y="376" font-size="22" font-weight="700">请求仲裁</text>
<text x="305" y="414" font-size="20">2 格</text>
<rect x="463" y="335" width="258" height="104" rx="10" fill="#dfedf5" stroke="#859dac" stroke-width="2"/>
<text x="477" y="376" font-size="22" font-weight="700">AHB 访问</text>
<text x="477" y="414" font-size="20">3 格</text>
<rect x="721" y="335" width="86" height="104" rx="10" fill="#d9eee4" stroke="#859dac" stroke-width="2"/>
<text x="735" y="376" font-size="22" font-weight="700">Ack</text>
<text x="735" y="414" font-size="20">1 格</text>
<rect x="893" y="335" width="172" height="104" rx="10" fill="#e9e0f1" stroke="#859dac" stroke-width="2"/>
<text x="907" y="376" font-size="22" font-weight="700">请求仲裁</text>
<text x="907" y="414" font-size="20">2 格</text>
<rect x="1065" y="335" width="258" height="104" rx="10" fill="#dfedf5" stroke="#859dac" stroke-width="2"/>
<text x="1079" y="376" font-size="22" font-weight="700">AHB 访问</text>
<text x="1079" y="414" font-size="20">3 格</text>
<rect x="1323" y="335" width="86" height="104" rx="10" fill="#d9eee4" stroke="#859dac" stroke-width="2"/>
<text x="1337" y="376" font-size="22" font-weight="700">Ack</text>
<text x="1337" y="414" font-size="20">1 格</text>
<rect x="635" y="490" width="172" height="104" rx="10" fill="#e9e0f1" stroke="#859dac" stroke-width="2"/>
<text x="649" y="531" font-size="22" font-weight="700">请求仲裁</text>
<text x="649" y="569" font-size="20">2 格</text>
<rect x="807" y="490" width="258" height="104" rx="10" fill="#dfedf5" stroke="#859dac" stroke-width="2"/>
<text x="821" y="531" font-size="22" font-weight="700">AHB 访问</text>
<text x="821" y="569" font-size="20">3 格</text>
<rect x="1065" y="490" width="86" height="104" rx="10" fill="#d9eee4" stroke="#859dac" stroke-width="2"/>
<text x="1079" y="531" font-size="22" font-weight="700">Ack</text>
<text x="1079" y="569" font-size="20">1 格</text>
<text x="45" y="666" font-size="22">A / B 仅区分原图两行，不是 DMA1 的硬件通道编号；留白表示原图未画阶段。</text>
<rect x="45" y="699" width="737" height="166" rx="10" fill="#fff5dc" stroke="#d8ab42" stroke-width="2"/>
<text x="65" y="738" font-size="25" font-weight="700">交叠① · t5–t7（原图首次交叠）</text>
<text x="65" y="777" font-size="22">B 请求仲裁：A 的末1格 AHB访问 + 1格 Ack。</text>
<text x="65" y="817" font-size="22">图中两格仲裁没有全部落在 A 的 AHB访问块内。</text>
<rect x="808" y="699" width="747" height="166" rx="10" fill="#f0f5fe" stroke="#87a6ca" stroke-width="2"/>
<text x="828" y="738" font-size="25" font-weight="700">交叠② · t8–t10（原图后续交叠）</text>
<text x="828" y="777" font-size="22">A 再次请求仲裁：与 B 的末2格 AHB访问交叠。</text>
<text x="828" y="817" font-size="22">两行 AHB访问块本身没有交叠；不表示双搬运引擎。</text>
<rect x="45" y="890" width="1510" height="145" rx="10" fill="#f8f4f0" stroke="#ba9d80" stroke-width="2"/>
<text x="65" y="930" font-size="25" font-weight="700">原文与原图分开保留，差异不在这里裁决</text>
<text x="65" y="969" font-size="22">§5.2正文称仲裁可在 DMA 的 AHB访问“最后两个周期”内进行；图3首次交叠画成访问末格 + Ack。</text>
<text x="65" y="1007" font-size="21">此处记录图文表达／粒度差异，不称为 ST 正式勘误，也不把图中格数作为 F103 最坏延迟或吞吐保证。</text>
<text x="45" y="1080" font-size="20">来源：AN2548 Rev9，§5.2 Total service time and parallelism，印刷/PDF第8页，Figure 3。</text>
<text x="45" y="1114" font-size="20">自主 SVG：重新编排为分行阶段图；未使用原图像素。格数、阶段名称与相对起止位置据固定本地原页读取。</text>
</g></svg>