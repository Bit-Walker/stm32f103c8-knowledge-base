<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc">
<title id="title">STM32F103C8T6：CPU、DMA1 与共享总线资源</title>
<desc id="desc">ICode 独立连接 Flash 指令接口。DCode、System 和 DMA1 AHB 主端口分别进入总线矩阵；矩阵连接 Flash 数据接口、SRAM 和共享 AHB 系统路径。下方单独说明 DMA1 七通道请求仲裁，不是七个并行搬运引擎。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3b596b"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#007b69"/></marker></defs>
<rect width="1600" height="1390" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#183345">
<text x="45" y="52" font-size="33" font-weight="700">STM32F103C8T6 · CPU、DMA1 与共享总线资源</text>
<text x="45" y="88" font-size="21">自主示意图｜箭头表示访问请求方向，不表示读回数据方向；仅列 DMA 相关路径与外设示例。</text>
<text x="45" y="130" font-size="24" font-weight="700">01  访问路径：三个 CPU 端口分别表示</text>
<rect x="45" y="155" width="280" height="265" rx="12" fill="#fff3dc" stroke="#91a8b6" stroke-width="2"/>
<text x="70" y="195" font-size="26" font-weight="700">Cortex-M3 CPU</text>
<text x="70" y="247" font-size="22">ICode · Flash 取指</text>
<text x="70" y="322" font-size="22">DCode · 常量 / 调试</text>
<text x="70" y="397" font-size="20">System · SRAM / 外设</text>
<rect x="575" y="275" width="285" height="415" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="603" y="319" font-size="27" font-weight="700">AHB 总线矩阵</text>
<text x="603" y="374" font-size="21" font-weight="700">CPU / DMA 访问仲裁</text>
<text x="603" y="412" font-size="20">同一从端口发生竞争时</text>
<text x="603" y="447" font-size="22">采用 round-robin</text>
<text x="603" y="482" font-size="21">（轮转）仲裁</text>
<text x="603" y="552" font-size="22" font-weight="700">不同从端口可并行</text>
<text x="603" y="589" font-size="21">仍须满足各自路径</text>
<text x="603" y="623" font-size="21">及目标资源的约束</text>
<path d="M325 238 H1060" fill="none" stroke="#007b69" stroke-width="3" marker-end="url(#green)"/>
<text x="390" y="224" font-size="22" font-weight="700" fill="#007b69">ICode：不经过此总线矩阵</text>
<path d="M325 312 H575" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="402" y="302" font-size="21">DCode</text>
<path d="M325 388 H575" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="402" y="378" font-size="21">System</text>
<rect x="1060" y="155" width="300" height="180" rx="12" fill="#e6f5ef" stroke="#91a8b6" stroke-width="2"/>
<text x="1082" y="192" font-size="23" font-weight="700">FLITF · Flash 接口</text>
<text x="1082" y="244" font-size="21">指令接口 / 预取</text>
<text x="1082" y="311" font-size="21">数据接口</text>
<rect x="1440" y="155" width="120" height="180" rx="12" fill="#e6f5ef" stroke="#91a8b6" stroke-width="2"/>
<text x="1462" y="241" font-size="23" font-weight="700">Flash</text>
<path d="M1360 250 H1440" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M860 310 H1060" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="890" y="293" font-size="19">数据访问</text>
<rect x="1060" y="358" width="500" height="97" rx="12" fill="#e6f5ef" stroke="#91a8b6" stroke-width="2"/>
<text x="1082" y="396" font-size="25" font-weight="700">SRAM</text>
<text x="1082" y="432" font-size="21">CPU 与 DMA1 可访问的存储区</text>
<path d="M860 407 H1060" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="470" width="280" height="220" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="70" y="514" font-size="28" font-weight="700">DMA1</text>
<text x="70" y="554" font-size="24">7 个通道</text>
<text x="70" y="592" font-size="21">共享一个 AHB 主端口</text>
<text x="70" y="635" font-size="20">通道仲裁见下方</text>
<path d="M325 580 H575" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="390" y="564" font-size="20">AHB 主端口</text>
<path d="M860 640 H952 V528 H1060" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M952 640 H1060" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="858" y="735" font-size="19">共享 AHB 系统路径</text>
<rect x="1060" y="481" width="500" height="109" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="1082" y="515" font-size="23" font-weight="700">AHB → APB1 桥</text>
<text x="1082" y="548" font-size="20">USART2/3、SPI2、I2C1/2、TIM2/3/4</text>
<text x="1082" y="576" font-size="19">等 APB1 外设</text>
<rect x="1060" y="610" width="500" height="109" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="1082" y="645" font-size="23" font-weight="700">AHB → APB2 桥</text>
<text x="1082" y="679" font-size="20">USART1、SPI1、ADC1、TIM1、GPIO</text>
<text x="1082" y="706" font-size="19">等 APB2 外设（并非均有 DMA 请求）</text>
<rect x="45" y="746" width="1515" height="138" rx="12" fill="#f8f5ee" stroke="#cbbd9a" stroke-width="2"/>
<text x="66" y="780" font-size="23" font-weight="700">Flash 接口另有仲裁；不能把它与矩阵轮转仲裁混为一谈。</text>
<text x="66" y="816" font-size="21">RM0008：DCode 数据访问优先于 ICode；DMA 通过 Flash 的数据访问路径读取，也优先于 ICode。</text>
<text x="66" y="851" font-size="21">APB 桥：8 / 16 位窄写会扩展为 32 位访问并复制数据；寄存器支持何种访问宽度仍须逐项核对。</text>
<text x="45" y="932" font-size="24" font-weight="700">02  DMA1 内部：请求选择与单项搬运</text>
<rect x="45" y="957" width="465" height="175" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="68" y="995" font-size="24" font-weight="700">外设请求 → 固定通道映射</text>
<text x="68" y="1030" font-size="21">同通道的请求先逻辑或</text>
<text x="68" y="1064" font-size="21">同一时刻只使能一个共享请求源</text>
<text x="68" y="1100" font-size="19">MEM2MEM：软件使能后启动，无需外设请求</text>
<rect x="567" y="957" width="470" height="175" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="590" y="995" font-size="24" font-weight="700">7 通道 → 通道仲裁器</text>
<text x="590" y="1030" font-size="21">四级软件优先级（PL）</text>
<text x="590" y="1064" font-size="21">同级时，较小通道号优先</text>
<text x="590" y="1100" font-size="19">此优先级不改变 CPU / DMA 矩阵轮转规则</text>
<rect x="1094" y="957" width="466" height="175" rx="12" fill="#eef4f8" stroke="#91a8b6" stroke-width="2"/>
<text x="1117" y="995" font-size="24" font-weight="700">同一 DMA1 的访问序列</text>
<text x="1117" y="1030" font-size="21">读一个源数据项 → 写一个目的数据项</text>
<text x="1117" y="1064" font-size="21">→ CNDTR 剩余数量减 1</text>
<text x="1117" y="1100" font-size="21">外设事务另有请求 / 确认握手</text>
<path d="M510 1045 H567" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1037 1045 H1094" fill="none" stroke="#3b596b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="45" y="1179" font-size="22" font-weight="700">范围：C8 仅有 DMA1；无 DMA2、DMAMUX、FSMC、SDIO。七通道不等于七个并行搬运引擎。</text>
<text x="45" y="1217" font-size="21">本图不绘制跨通道精确周期时序；AN2548 Rev9 图3与 p8 文字的重叠周期口径须保留差异。</text>
<text x="45" y="1270" font-size="18">依据：RM0008 Rev21 §3.1 pp47–49、§3.3 pp58–59、图49 / §13.3 pp276–278、§13.3.7 p281。</text>
<text x="45" y="1304" font-size="18">交叉依据：DS5319 Rev20 表2 / 图1 pp10–11；AN2548 Rev9 §2 pp3–4、§5.2–5.4 pp8–9。</text>
<text x="45" y="1338" font-size="18">图内来源均为印刷页码；此图筛选 C8 适用内容，不是官方原图，也不是芯片物理布局图。</text>
</g></svg>