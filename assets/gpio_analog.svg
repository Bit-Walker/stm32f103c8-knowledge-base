<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc"><title id="title">GPIO 模拟：模拟通路与数字隔离</title><desc id="desc">自主绘制的技术关系示意。带圆点的分支连接；无圆点的交叉不表示连接。具体型号与电气适用条件见图下注。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e42" font-size="21"><text x="48" y="55" font-size="36" fill="#182e42" text-anchor="start" font-weight="bold">GPIO 模拟：模拟通路与数字隔离</text><text x="48" y="96" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">模拟输入直接送片上外设；施密特关闭，其输出固定为 0；输出缓冲器禁用。</text><rect x="350" y="310" width="710" height="305" rx="14" fill="none" stroke="#a4b9c8" stroke-dasharray="9 7" stroke-width="2"/><text x="368" y="340" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">输入驱动区</text><rect x="350" y="640" width="710" height="250" rx="14" fill="none" stroke="#a4b9c8" stroke-dasharray="9 7" stroke-width="2"/><text x="368" y="670" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">输出驱动区</text><rect x="50" y="390" width="100" height="60" rx="9" fill="#fff4da" stroke="#91640e" stroke-width="2"/><text x="100.0" y="427.0" font-size="21" fill="#91640e" text-anchor="middle" font-weight="normal">I/O脚</text><polyline points="150,420 740,420" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><circle cx="200" cy="420" r="5" fill="#155e91"/><circle cx="300" cy="420" r="5" fill="#155e91"/><polyline points="200,420 200,342" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><path d="M188,342 L200,318 L212,342 Z M184,318 H216" fill="white" stroke="#155e91" stroke-width="2.5"/><polyline points="200,318 200,290" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><text x="200" y="270" font-size="18" fill="#182e42" text-anchor="middle" font-weight="normal">VDD 或 VDD_FT(1)</text><polyline points="184,290 216,290" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="200,420 200,478" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><path d="M188,502 L200,478 L212,502 Z M184,478 H216" fill="white" stroke="#155e91" stroke-width="2.5"/><polyline points="200,502 200,550" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><polyline points="184,550 216,550" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round"/><text x="200" y="578" font-size="18" fill="#182e42" text-anchor="middle" font-weight="normal">VSS</text><text x="60" y="615" font-size="18" fill="#687b89" text-anchor="start" font-weight="normal">上下保护二极管</text><rect x="740" y="382" width="180" height="76" rx="9" fill="#f0f2f4" stroke="#687b89" stroke-width="2"/><text x="830.0" y="412.5" font-size="20" fill="#687b89" text-anchor="middle" font-weight="normal">TTL 施密特</text><text x="830.0" y="441.5" font-size="20" fill="#687b89" text-anchor="middle" font-weight="normal">off · 输出强制 0</text><polyline points="920,420 1170,420" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1170" y="382" width="180" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1260.0" y="412.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">IDR</text><text x="1260.0" y="441.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">输入数据寄存器</text><text x="975" y="408" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">恒定 0</text><polyline points="1350,420 1490,420" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1480" y="390" font-size="20" fill="#182e42" text-anchor="end" font-weight="normal">软件读</text><polyline points="300,420 300,195 1450,195" fill="none" stroke="#0d7969" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="300" cy="420" r="5" fill="#155e91"/><text x="560" y="180" font-size="20" fill="#0d7969" text-anchor="start" font-weight="normal">模拟输入 → 片上外设（仅实际支持模拟功能的引脚）</text><text x="395" y="563" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">弱上拉 / 弱下拉：均禁用</text><rect x="1170" y="712" width="180" height="76" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1260.0" y="742.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">ODR</text><text x="1260.0" y="771.5" font-size="19" fill="#155e91" text-anchor="middle" font-weight="normal">输出数据寄存器</text><polyline points="1350,750 1485,750" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1480" y="719" font-size="20" fill="#182e42" text-anchor="end" font-weight="normal">软件读 / 写</text><rect x="1170" y="920" width="180" height="62" rx="9" fill="#edf5fb" stroke="#155e91" stroke-width="2"/><text x="1260.0" y="943.5" font-size="18" fill="#155e91" text-anchor="middle" font-weight="normal">BSRR / BRR</text><text x="1260.0" y="972.5" font-size="18" fill="#155e91" text-anchor="middle" font-weight="normal">位设置 / 复位</text><polyline points="1260,920 1260,788" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1485,950 1350,950" fill="none" stroke="#155e91" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1480" y="917" font-size="20" fill="#182e42" text-anchor="end" font-weight="normal">软件写</text><polyline points="1170,750 930,750" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round"/><polyline points="870,750 300,750 300,420" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round"/><circle cx="930" cy="750" r="5" fill="#687b89"/><circle cx="870" cy="750" r="5" fill="#687b89"/><polyline points="870,750 915,722" fill="none" stroke="#687b89" stroke-width="2.7" stroke-linejoin="round"/><text x="695" y="807" font-size="22" fill="#a44236" text-anchor="middle" font-weight="normal">输出缓冲器禁用 · 路径断开</text><text x="50" y="1010" font-size="19" fill="#687b89" text-anchor="start" font-weight="normal">实线：电气 / 信号连接   ●：相连分支   箭头：数据方向</text><text x="50" y="1042" font-size="19" fill="#687b89" text-anchor="start" font-weight="normal">虚线框：功能分区（不表示制造尺寸）   空断点：断开路径</text><polyline points="48,1104 1552,1104" fill="none" stroke="#ccd8e1" stroke-width="2.7" stroke-linejoin="round"/><text x="48" y="1130" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">来源：ST RM0008 Rev21；自主布局的技术关系图，非原厂插图。 §9.1.10 pp165–166 Figure18</text><text x="48" y="1161" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">弱上下拉禁用；IDR 读为 0。仅表示数字输入级关闭，不表示整脚、模拟外设或整芯片功耗为零。</text><text x="48" y="1192" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">图内(1)沿用原图标记；p166 未另印该注。VDD_FT 含义按 p160/163–165 注1解释，不能冒充 p166 原注。</text><text x="48" y="1223" font-size="20" fill="#687b89" text-anchor="start" font-weight="normal">适用：STM32F103C8T6（LQFP48）；普通 / FT 类型、模拟能力及电气限制须按 DS5319 Rev20 §3 Table5 核对。</text></g></svg>