<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1040" viewBox="0 0 1360 1040" role="img" aria-labelledby="title desc"><title id="title">TIM1互补输出死区和短脉冲消失</title><desc id="desc">三个相对时间波形分别表示普通互补死区、负参考脉冲短于死区导致N脉冲消失、正参考脉冲短于死区导致主脉冲消失。</desc><rect width="1360" height="1040" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#17314b}.title{font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}.bold{font-size:22px;font-weight:bold}</style><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="#805b30"/></marker></defs>
<text x="30" y="46" class="title">TIM1 死区：延迟开通与短脉冲消失</text>
<text x="30" y="82" class="body">条件：CCxE=CCxNE=MOE=1，CCxP=CCxNP=0，保护路径未禁止输出；x=1、2、3。</text>
<text x="30" y="112" class="small">横轴仅表示相对时间；DT 为死区时间（s），图中长度不代表某个实际纳秒数。</text>
<rect x="25" y="155" width="1305" height="235" rx="10" fill="#f4f7fa"/>
<text x="45" y="190" class="bold">A  正常互补：两侧开通分别延迟 DT</text>
<text x="45" y="233" class="body">OCxREF</text>
<text x="45" y="279" class="body">OCx 主输出</text>
<text x="45" y="325" class="body">OCxN 互补输出</text>
<rect x="25" y="420" width="1305" height="235" rx="10" fill="#f4f7fa"/>
<text x="45" y="455" class="bold">B  参考低脉冲短于 DT：N 输出脉冲消失</text>
<text x="45" y="498" class="body">OCxREF</text>
<text x="45" y="544" class="body">OCx 主输出</text>
<text x="45" y="590" class="body">OCxN 互补输出</text>
<rect x="25" y="685" width="1305" height="235" rx="10" fill="#f4f7fa"/>
<text x="45" y="720" class="bold">C  参考高脉冲短于 DT：主输出脉冲消失</text>
<text x="45" y="763" class="body">OCxREF</text>
<text x="45" y="809" class="body">OCx 主输出</text>
<text x="45" y="855" class="body">OCxN 互补输出</text>
<path d="M480 207 V337" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M570 207 V337" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M860 207 V337" stroke="#aab9c3" stroke-dasharray="5 5"/>
