<path d="M250 828 H560 V852 H760 V828 H1285" fill="none" stroke="#a15d24" stroke-width="3"/>
<path d="M630 878 H760" fill="none" stroke="#805b30" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="683.0" y="903" class="small">DT</text>
<text x="920" y="792" class="small">OCx 持续无效</text>
<text x="30" y="956" class="small">波形表示手册的有效高条件；实际功率器件是否关断仍取决于驱动器极性、延迟和外部电路。</text>
<text x="30" y="986" class="small">共用 DTG 编码按四个分段换算，时基为 CKD 选定的 tDTS，不能用计数 PSC 分频直接替代。</text>
<text x="30" y="1016" class="small">来源：RM0008 Rev21 图86～88，pp321–322；BDTR.DTG字段p361。此图不代表板端测量。</text>
</svg>
