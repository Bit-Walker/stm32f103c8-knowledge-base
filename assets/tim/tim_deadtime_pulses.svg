<text x="513.0" y="373" class="small">DT</text>
<path d="M860 348 H950" fill="none" stroke="#805b30" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="893.0" y="373" class="small">DT</text>
<path d="M560 472 V602" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M630 472 V602" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M760 472 V602" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M250 471 H560 V495 H630 V471 H1285" fill="none" stroke="#234765" stroke-width="3"/>
<path d="M250 517 H560 V541 H760 V517 H1285" fill="none" stroke="#176f9e" stroke-width="3"/>
<path d="M250 587 H1285" fill="none" stroke="#a15d24" stroke-width="3"/>
