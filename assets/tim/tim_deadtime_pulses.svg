<path d="M630 737 V867" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M760 737 V867" stroke="#aab9c3" stroke-dasharray="5 5"/>
<path d="M250 760 H560 V736 H630 V760 H1285" fill="none" stroke="#234765" stroke-width="3"/>
