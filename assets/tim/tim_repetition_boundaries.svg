<circle cx="440" cy="637" r="6" fill="white" stroke="#176f9e" stroke-width="2"/>
<text x="459" y="643" class="small">空心点：奇数 RCR 的另一峰 / 谷相位；与实心点属于不同运行情形。</text>
<text x="30" y="678" class="small">RCR=255：边沿最多每 256 个完整周期更新；中心最多每 256 个半周期边界，即 128 个完整周期。</text>
<text x="30" y="721" class="bold">软件重新同步：以 RCR=3 为例，且 UDIS=0</text>
<rect x="30" y="751" width="290" height="145" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="43" y="781" class="bold">重复计数尚未结束</text>
<text x="43" y="811" class="small">当前还未累计满 4 个边界</text>
<text x="43" y="836" class="small">旧相位下的下一周期性</text>
<text x="43" y="861" class="small">UEV 尚未到来</text>
<rect x="375" y="751" width="475" height="145" rx="8" fill="#fff4dc" stroke="#a5bbc9"/>
<text x="388" y="781" class="bold">软件写 UG</text>
<text x="388" y="811" class="small">立即产生 UEV，并重新初始化 CNT / PSC 计数；</text>
<text x="388" y="836" class="small">内部重复计数重新装入 RCR=3。</text>
<text x="388" y="861" class="small">URS 继续决定更新中断 / DMA 请求的来源。</text>
<rect x="905" y="751" width="550" height="145" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="918" y="781" class="bold">按重新建立的计数相位继续</text>
<text x="918" y="811" class="small">继续计数时，每 4 个新计数边界产生周期性 UEV。</text>
<text x="918" y="836" class="small">中心模式的首次峰 / 谷相位须核对初始化和写入顺序。</text>
<text x="918" y="861" class="small">UEV 与 UIF、中断 / DMA 请求仍由各自条件区分。</text>
<path d="M320 823 H375" stroke="#406780" stroke-width="2" marker-end="url(#a)" fill="none"/><path d="M850 823 H905" stroke="#406780" stroke-width="2" marker-end="url(#a)" fill="none"/>
<text x="30" y="945" class="small">UEV：更新事件；RCR：重复计数寄存器（C8仅TIM1具备，8位）；CNT：计数器；PSC：时基预分频器。</text>
<text x="30" y="977" class="small">本图重组原图72的RCR=0/1/2/3及软件重新同步情形，不给出中断执行时刻或实板延迟。</text>
<text x="30" y="1008" class="small">来源：RM0008 Rev21 §14.3.3及图72，pp306–307；RCR字段p357。TIM2～TIM4没有RCR。</text>
