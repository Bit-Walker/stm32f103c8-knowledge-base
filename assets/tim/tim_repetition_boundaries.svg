<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc"><title id="title">TIM1重复计数器的更新边界</title><desc id="desc">RCR零到三对应每一二三四个计数边界更新。中心模式峰谷各为边界，奇数RCR有峰谷两种更新相位。软件UG重新建立重复计数相位。</desc><rect width="1500" height="1030" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#17314b}.title{font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}.bold{font-size:22px;font-weight:bold}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#406780"/></marker></defs>
<text x="30" y="46" class="title">TIM1 RCR：边沿与中心对齐的更新节奏</text>
<text x="30" y="83" class="body">正常连续计数、ARR&gt;0、UDIS=0、无额外复位 / UG；横轴为边界序号，不共用时间尺度。</text>
<text x="30" y="115" class="small">以一个已发生的周期性 UEV 作为相位起点；此图不保证启动后的第一次 UEV 出现时刻。</text>
<rect x="210" y="148" width="640" height="450" rx="10" fill="#f0f6f8"/><rect x="900" y="148" width="550" height="450" rx="10" fill="#f4f7ef"/>
<text x="235" y="184" class="bold">中心对齐：峰和谷各算一个边界</text>
<text x="925" y="184" class="bold">边沿对齐：每个完整周期一个边界</text>
<text x="925" y="214" class="small">向上为上溢；向下为下溢。</text>
