<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img"><title>输出参考到引脚：比较、清除、极性和高级控制</title><rect width="1500" height="1040" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#17314b}.title{font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}.bold{font-size:22px;font-weight:bold}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#406780"/></marker></defs>
<text x="30" y="45" class="title">输出参考到引脚：比较、清除、极性和高级控制</text>
<text x="30" y="81" class="body">以输出模式CCxS=00为前提；实际引脚必须再满足GPIO复用、封装引脚与外部电路条件。</text>
<rect x="30" y="128" width="395" height="165" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="44" y="157" class="bold">比较与参考发生</text>
<text x="44" y="187" class="small">CNT与活动CCRx比较</text>
<text x="44" y="212" class="small">OCxM三位编码：冻结 / 匹配置位 /</text>
<text x="44" y="237" class="small">匹配清零 / 翻转 / 强制 / PWM1或2</text>
<text x="44" y="262" class="small">动态模式切换按字段条件处理</text>
<rect x="505" y="128" width="445" height="165" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="519" y="157" class="bold">OCxREF清除条件</text>
<text x="519" y="187" class="small">OCxCE与ETRF控制清除</text>
<text x="519" y="212" class="small">OCREF清除作用于参考发生层</text>
<text x="519" y="237" class="small">需遵守ETPS=00、ECE=0等条件</text>
<text x="519" y="262" class="small">解除ETRF不等于立即重新有效</text>
<rect x="1030" y="128" width="435" height="165" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="1044" y="157" class="bold">内部OCxREF</text>
<text x="1044" y="187" class="small">有效 / 无效是内部逻辑含义</text>
<text x="1044" y="212" class="small">最终引脚还可反相、延迟、禁用</text>
<text x="1044" y="237" class="small">冻结或强制模式不等同PWM</text>
<text x="1044" y="262" class="small">占空比公式须对应实际模式</text>
<path d="M425 211 H505" fill="none" stroke="#406780" stroke-width="2" marker-end="url(#a)"/>
<path d="M950 211 H1030" fill="none" stroke="#406780" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="365" width="680" height="195" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="44" y="394" class="bold">TIM2～TIM4：普通主输出</text>
<text x="44" y="424" class="small">OCxREF → CCxP极性与CCxE使能控制 → OCx</text>
<text x="44" y="449" class="small">无互补端、死区发生器、BDTR或MOE</text>
<text x="44" y="474" class="small">禁用输出不自动等于引脚被驱动为低</text>
<text x="44" y="499" class="small">CH1～CH4分别配置；共享同一CNT / PSC / ARR</text>
<text x="44" y="524" class="small">输出逻辑与GPIO电气路径须同时满足</text>
<rect x="785" y="365" width="680" height="195" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="799" y="394" class="bold">TIM1 CH1～CH3：主 / N输出</text>
<text x="799" y="424" class="small">参考与CCxE / CCxNE状态共同决定主/N路径</text>
<text x="799" y="449" class="small">双端放行时按参考 / 反向参考插入死区，再按极性输出</text>
<text x="799" y="474" class="small">仅N端放行时跟随未互补的参考关系，不能省略真值表</text>
<text x="799" y="499" class="small">MOE、OSSR、OSSI、OIS与Break决定活动 / 关闭状态</text>
<text x="799" y="524" class="small">CCPC允许模式与使能控制在COM同步装入</text>
<path d="M1245 293 V329 H365 V365" fill="none" stroke="#406780" stroke-width="2" marker-end="url(#a)"/>
<path d="M1245 329 H1120 V365" fill="none" stroke="#406780" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="625" width="680" height="175" rx="8" fill="#edf5fa" stroke="#a5bbc9"/>
<text x="44" y="654" class="bold">TIM1 CH4的范围</text>
<text x="44" y="684" class="small">只有OC4，无OC4N互补输出及其死区路径</text>
<text x="44" y="709" class="small">OC4M为CCMR2中的三位字段</text>
<text x="44" y="734" class="small">适用的主输出使能 / Break条件仍须遵守</text>
<text x="44" y="759" class="small">CH4不使用CH1～CH3的互补控制预装载机制</text>
<rect x="785" y="625" width="680" height="175" rx="8" fill="#fff4dc" stroke="#a5bbc9"/>
<text x="799" y="654" class="bold">原图的标签差异</text>
<text x="799" y="684" class="small">图80出现OC5REF、四位OC1M与未说明的上标1</text>
<text x="799" y="709" class="small">图81在CH4结构中写OC1M，并重复CNT&gt;CCR4</text>
<text x="799" y="734" class="small">这些通用 / 重复标签不建立C8额外字段或通道</text>
<text x="799" y="759" class="small">按三位OCxM与实际比较关系解释</text>
<text x="30" y="851" class="small">这是功能依赖图；“清参考”和“Break清MOE”处于不同控制层，不能互换保护条件或恢复结论。</text>
<text x="30" y="884" class="small">CCxP / CCxNP：主 / N端极性；CCxE / CCxNE：使能；MOE：主输出总使能；OCxM：输出比较模式。</text>
<text x="30" y="917" class="small">OSSR / OSSI：运行 / 空闲关闭态选择；OISx / OISxN：空闲电平；x为通道号，具体条件见完整输出真值表。</text>
<text x="30" y="970" class="small">来源：RM0008 Rev21图80/81/127，pp313/383；表83 p355；CCMR、CCER、BDTR字段pp349–361。</text>
<text x="30" y="1003" class="small">OCREF清除的100%占空比与外部复位限制另按ES096 Rev15 §§2.6.4/2.6.7核对。</text>
</svg>
